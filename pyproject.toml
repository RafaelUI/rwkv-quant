[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-quant"
version = "0.2.1"
description = "Quantization toolkit and Metal inference backend for RWKV-7 on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alexei Goncharov" }]
keywords = ["rwkv", "quantization", "mlx", "metal", "apple-silicon", "llm", "inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
# 06.10: mlx и rwkv-metal -- только на macOS. На Linux mlx ставится, но не импортируется
# (нет libmlx.so), а rwkv-metal тянет его в __init__; quantize() на CUDA не берёт из них ничего
# (проверено на сервере: sys.modules пуст). Для пользователя Mac набор зависимостей прежний.
dependencies = [
    "mlx>=0.31; sys_platform == 'darwin'",
    "numpy",
    "torch",
    "safetensors",
    "rwkv-metal>=0.1.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://impulseleap.com"

[tool.setuptools.packages.find]
include = ["rwkv_quant*"]

[tool.setuptools.package-data]
rwkv_quant = ["data/*.txt", "data/*.jsonl"]
